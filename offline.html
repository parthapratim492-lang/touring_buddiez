<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're Offline | Touring Buddiez</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
<style>
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: var(--forest-800); text-align:center; padding: var(--sp-5);
  }
  .offline-card{ max-width:440px; }
  .offline-card img{ width:64px; height:auto; margin-bottom: var(--sp-4); }
  .offline-card i{ font-size:2.5rem; color: var(--brass-400); margin-bottom: var(--sp-4); }
  .offline-card h1{ color: var(--mist-050); font-size: var(--fs-2xl); margin-bottom: var(--sp-3); }
  .offline-card p{ color: rgba(243,246,241,0.75); font-size: var(--fs-md); margin-bottom: var(--sp-5); line-height:1.6; }
</style>
</head>
<body>
  <div class="offline-card">
    <img src="assets/logo/logo.png" alt="Touring Buddiez logo">
    <i class="fa-solid fa-signal"></i>
    <h1>You're offline</h1>
    <p>We can't reach the internet right now. Check your connection and try again — some pages you've already visited may still be available.</p>
    <button class="btn btn-primary" onclick="location.reload()">
      <i class="fa-solid fa-rotate-right"></i> Try Again
    </button>
  </div>
</body>
</html>
